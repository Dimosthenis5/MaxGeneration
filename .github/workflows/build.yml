name: Build iPhone app

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (unsigned)
        run: |
          xcodebuild \
            -project MaxGeneration.xcodeproj \
            -scheme MaxGeneration \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MaxGeneration.app Payload/
          zip -qry MaxGeneration.ipa Payload
          ls -lh MaxGeneration.ipa

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: MaxGeneration-ipa
          path: MaxGeneration.ipa
